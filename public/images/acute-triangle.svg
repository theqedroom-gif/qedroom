<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="title">
    <title id="title">Acute triangle ABC: all three angles are less than 90 degrees</title>
    <!-- The QED Room colors: matches qed-design/tokens.css -->
    <defs>
        <style>
            .math { font-family: "Cambria Math", "Times New Roman", serif; font-style: italic; }
        </style>
    </defs>

    <!-- triangle -->
    <path d="M80 330 L520 330 L340 70 Z" fill="#F5F5F5" stroke="#3B5D39" stroke-width="5" stroke-linejoin="round"/>

    <!-- angle A -->
    <path d="M80 330 L124 330 A44 44 0 0 0 111.1 298.9 Z" fill="#E8C544" fill-opacity=".35"/>
    <path d="M124 330 A44 44 0 0 0 111.1 298.9" fill="none" stroke="#E8C544" stroke-width="4"/>

    <!-- angle B -->
    <path d="M520 330 L495 293.8 A44 44 0 0 0 476 330 Z" fill="#E8C544" fill-opacity=".35"/>
    <path d="M495 293.8 A44 44 0 0 0 476 330" fill="none" stroke="#E8C544" stroke-width="4"/>

    <!-- angle C -->
    <path d="M340 70 L308.9 101.1 A44 44 0 0 0 365 106.2 Z" fill="#E8C544" fill-opacity=".35"/>
    <path d="M308.9 101.1 A44 44 0 0 0 365 106.2" fill="none" stroke="#E8C544" stroke-width="4"/>

    <!-- vertex labels -->
    <text class="math" x="51.9" y="340.4" font-size="34" fill="#333333" text-anchor="middle" dominant-baseline="central">A</text>
    <text class="math" x="547.7" y="341.6" font-size="34" fill="#333333" text-anchor="middle" dominant-baseline="central">B</text>
    <text class="math" x="344.6" y="40.3" font-size="34" fill="#333333" text-anchor="middle" dominant-baseline="central">C</text>

    <!-- side labels: each side is named after the opposite vertex -->
    <text class="math" x="449.7" y="186.3" font-size="30" fill="#575757" text-anchor="middle" dominant-baseline="central">a</text>
    <text class="math" x="193" y="183" font-size="30" fill="#575757" text-anchor="middle" dominant-baseline="central">b</text>
    <text class="math" x="300" y="354" font-size="30" fill="#575757" text-anchor="middle" dominant-baseline="central">c</text>
</svg>
