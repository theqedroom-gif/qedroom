<!DOCTYPE html>
<html lang="fil">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinoy Math Notes</title>
    <meta name="description" content="Free math notes, examples and exercises for Filipino students, from high school to college.">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; max-width: 1100px; margin: 40px auto; padding: 0 20px; color: #333; }
        h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; color: #111; }
        code { background: #f4f4f4; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 6px; overflow-x: auto; }
        blockquote { border-left: 4px solid #0070f3; margin: 0; padding-left: 20px; color: #555; background: #f9f9f9; padding: 10px 20px; }

        /* Two-column layout: menu on the left, notes on the right */
        .layout { display: flex; gap: 40px; align-items: flex-start; }
        #nav { flex: 0 0 240px; position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow-y: auto; border-right: 1px solid #eee; padding-right: 16px; }
        #content { flex: 1; min-width: 0; }

        /* Menu */
        nav a { color: #0070f3; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        nav a.active { color: #111; font-weight: 600; }
        nav ul { list-style: none; padding-left: 16px; margin: 2px 0 10px; }
        nav li { margin: 4px 0; }
        .nav-home { margin-bottom: 14px; }
        .nav-section { margin-top: 14px; font-size: 0.8em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
        .nav-section a { color: #666; }
        .nav-section + ul { padding-left: 0; }
        .crumbs { font-size: 0.85em; color: #888; margin-bottom: 10px; }
        .nav-title { font-size: 1.15em; font-weight: 700; margin-bottom: 6px; }
        .nav-title + ul { padding-left: 0; }
        ul.level-1 > li { margin-top: 10px; }
        ul.level-1 > li > a { font-weight: 600; }
        ul.level-2 { font-size: 0.95em; }

        /* Show/hide solutions */
        details { background: #f6f9ff; border: 1px solid #d6e4ff; border-radius: 6px; padding: 10px 16px; margin: 12px 0 24px; }
        summary { cursor: pointer; font-weight: 600; color: #0070f3; }
        details[open] summary { margin-bottom: 10px; }
        details[open] summary::after { content: " (click to hide)"; font-weight: normal; color: #888; font-size: 0.9em; }

        /* On phones, put the menu above the notes */
        @media (max-width: 700px) {
            .layout { flex-direction: column; gap: 20px; }
            #nav { position: static; flex-basis: auto; width: 100%; max-height: none; border-right: none; border-bottom: 1px solid #eee; padding: 0 0 12px; }
        }

        /* For the footer */
        .site-footer { margin-top: 60px; padding-top: 16px; border-top: 1px solid #eee; text-align: center; font-size: 0.9em; color: #888; }
        .site-footer a { color: #0070f3; text-decoration: none; margin: 0 6px; }

       /* For YT videos */
      iframe { max-width: 100%; border: 0; }
      .video iframe { width: 100%; height: auto; aspect-ratio: 16 / 9; }
    </style>

    <!-- Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <!-- LaTeX math renderer -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
</head>
<body>

    <div class="layout">
        <nav id="nav"></nav>
        <main id="content">Loading notes...</main>
    </div>

    <footer class="site-footer">
        <a href="https://www.facebook.com/theqedroom" target="_blank" rel="noopener">📘 Facebook</a>
        <span>·</span>
        <a href="https://www.youtube.com/@TheQEDRoom" target="_blank" rel="noopener">▶️ YouTube</a>
    </footer>

    <script>
        // All pages, titles and the menu structure live in pages.json.
        // The page with no "parent" is the homepage. Its children are the sections,
        // their children are the subsections, and so on.
        const SITE_TITLE = 'Pinoy Math Notes';

        const nav = document.getElementById('nav');
        const content = document.getElementById('content');
        const cache = {};
        let pages = [];
        let root = null;
        let showing = null;

        // Fetch a file as text. Cloudflare returns index.html for missing files, so catch that too.
        function fetchText(file) {
            if (cache[file]) return Promise.resolve(cache[file]);
            return fetch(file)
                .then(r => {
                    if (!r.ok) throw new Error(file + ' not found');
                    return r.text();
                })
                .then(text => {
                    if (text.trimStart().toLowerCase().startsWith('<!doctype html')) {
                        throw new Error(file + ' not found (check the file name and folder)');
                    }
                    cache[file] = text;
                    return text;
                });
        }

        // Front matter is no longer needed (pages.json has the titles), but remove it if present
        function stripFrontMatter(text) {
            return text.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n/, '');
        }

        const byFile = file => pages.find(p => p.file === file);
        const childrenOf = file => pages.filter(p => p.parent === file);   // keeps pages.json order

        // Home > Section > Subsection > ... > page
        function pathTo(page) {
            const path = [];
            while (page && !path.includes(page)) {
                path.unshift(page);
                page = byFile(page.parent);
            }
            return path;
        }

        function link(p, current) {
            const active = p === current ? ' class="active"' : '';
            return `<a href="#${p.file}"${active}>${p.title}</a>`;
        }

        // Homepage and section pages: every section with its subsections
        function homeMenu(current) {
            let html = `<div class="nav-home">${link(root, current)}</div>`;
            for (const section of childrenOf(root.file)) {
                html += `<div class="nav-section">${link(section, current)}</div>`;
                const subs = childrenOf(section.file);
                if (subs.length) html += '<ul>' + subs.map(s => `<li>${link(s, current)}</li>`).join('') + '</ul>';
            }
            return html;
        }

        // Inside a subsection: breadcrumb, then only that subsection's pages
        function subsectionMenu(path, current) {
            const [home, section, sub] = path;
            const open = new Set(path);
            return `<div class="crumbs">${link(home, current)} › ${link(section, current)}</div>`
                 + `<div class="nav-title">${link(sub, current)}</div>`
                 + tree(sub.file, open, current);
        }

        // Nested list of pages. Chapters and subchapters (the first two levels) are always shown;
        // anything deeper only opens when you are on that page or inside it.
        const ALWAYS_SHOWN_LEVELS = 2;
        function tree(parentFile, open, current, level = 1) {
            const kids = childrenOf(parentFile);
            if (kids.length === 0) return '';
            return `<ul class="level-${level}">` + kids.map(p => {
                const showKids = level < ALWAYS_SHOWN_LEVELS || open.has(p);
                return `<li>${link(p, current)}${showKids ? tree(p.file, open, current, level + 1) : ''}</li>`;
            }).join('') + '</ul>';
        }

        // Show the page named in the URL (e.g. #disciplines/calculus/limits.md), or the homepage
        function show() {
            const page = byFile(decodeURIComponent(location.hash.slice(1))) || root;
            const path = pathTo(page);
            showing = page;

            nav.innerHTML = (path[0] === root && path.length >= 3) ? subsectionMenu(path, page) : homeMenu(page);
            document.title = page === root ? SITE_TITLE : page.title + ' · ' + SITE_TITLE;
            window.scrollTo(0, 0);

            fetchText(page.file)
                .then(text => {
                    if (showing !== page) return;   // the reader already clicked somewhere else
                    if (window.MathJax && MathJax.typesetClear) MathJax.typesetClear();
                    content.innerHTML = marked.parse(stripFrontMatter(text));
                    if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
                })
                .catch(err => {
                    console.error(err);
                    content.innerHTML = `<p>Error: ${err.message}</p>`;
                });
        }

        fetchText('pages.json')
            .then(text => {
                try {
                    pages = JSON.parse(text);
                } catch (e) {
                    throw new Error('pages.json has a typo (check for a missing or extra comma or quote): ' + e.message);
                }
                root = pages.find(p => !p.parent);
                if (!root) throw new Error('pages.json needs one page with no "parent" (the homepage)');
                pages.forEach(p => {
                    if (p.parent && !byFile(p.parent)) console.warn(`"${p.file}" has parent "${p.parent}", which is not in pages.json`);
                });
                window.addEventListener('hashchange', show);
                show();
            })
            .catch(err => {
                console.error(err);
                content.innerHTML = `<p>Error: ${err.message}</p>`;
            });
    </script>
</body>
</html>
