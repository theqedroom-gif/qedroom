<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="title">
    <title id="title">Obtuse triangle ABC: angle C is greater than 90 degrees</title>
    <!-- The QED Room colors: green #305E35, yellow #EFC30C, gray #333333 -->
    <defs>
        <style>
            .math { font-family: "Cambria Math", "Times New Roman", serif; font-style: italic; }
        </style>
    </defs>

    <!-- triangle -->
    <path d="M60 280 L540 280 L220 150 Z" fill="#F4F7F3" stroke="#305E35" stroke-width="5" stroke-linejoin="round"/>

    <!-- angle A -->
    <path d="M60 280 L104 280 A44 44 0 0 0 94.1 252.3 Z" fill="#EFC30C" fill-opacity=".35"/>
    <path d="M104 280 A44 44 0 0 0 94.1 252.3" fill="none" stroke="#EFC30C" stroke-width="4"/>

    <!-- angle B -->
    <path d="M540 280 L499.2 263.4 A44 44 0 0 0 496 280 Z" fill="#EFC30C" fill-opacity=".35"/>
    <path d="M499.2 263.4 A44 44 0 0 0 496 280" fill="none" stroke="#EFC30C" stroke-width="4"/>

    <!-- angle C -->
    <path d="M220 150 L185.9 177.7 A44 44 0 0 0 260.8 166.6 Z" fill="#EFC30C" fill-opacity=".35"/>
    <path d="M185.9 177.7 A44 44 0 0 0 260.8 166.6" fill="none" stroke="#EFC30C" stroke-width="4"/>

    <!-- vertex labels -->
    <text class="math" x="30.6" y="286" font-size="34" fill="#333333" text-anchor="middle" dominant-baseline="central">A</text>
    <text class="math" x="569.6" y="284.8" font-size="34" fill="#333333" text-anchor="middle" dominant-baseline="central">B</text>
    <text class="math" x="204.3" y="124.5" font-size="34" fill="#333333" text-anchor="middle" dominant-baseline="central">C</text>

    <!-- side labels: each side is named after the opposite vertex -->
    <text class="math" x="389" y="192.8" font-size="30" fill="#6d6d6d" text-anchor="middle" dominant-baseline="central">a</text>
    <text class="math" x="124.9" y="196.4" font-size="30" fill="#6d6d6d" text-anchor="middle" dominant-baseline="central">b</text>
    <text class="math" x="300" y="304" font-size="30" fill="#6d6d6d" text-anchor="middle" dominant-baseline="central">c</text>
</svg>
